<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pedro Alfonso - Coach System v2.5.2</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #d4ff00; --bg: #111; --card: #222; --text: #eee; --accent: #00d4ff; --danger: #ff4444; --success: #28a745; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; }
        .container { max-width: 600px; margin: auto; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-top: 4px solid var(--primary); margin-bottom: 15px; }
        h1, h2, h3 { color: var(--primary); text-align: center; margin-top: 0; font-size: 1.5rem; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; box-sizing: border-box; font-size: 1rem; }
        input, select { background: #333; color: white; outline: none; border: 1px solid #444; }
        button { background: var(--primary); color: black; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        button.secondary { background: #444; color: white; margin-top: 10px; font-size: 0.8rem; }
        button.btn-day { background: #333; color: white; width: auto; padding: 8px 12px; font-size: 0.7rem; margin-right: 5px; border: 1px solid #444; }
        button.active-day { background: var(--primary); color: black; border-color: var(--primary); }
        .hidden { display: none; }
        .rutina-item { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-top: 10px; border-left: 4px solid var(--primary); }
        .badge { background: var(--primary); color: black; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        .visor-profe-box { background: #000; padding: 15px; border-radius: 10px; margin-top: 15px; border: 1px solid var(--accent); min-height: 50px; }
    </style>
</head>
<body>

<div class="container">
    <div id="section-auth" class="card">
        <h1>🏋️‍♂️ COACH SYSTEM v2.5.2</h1>
        <input type="text" id="auth-user" placeholder="Usuario">
        <input type="password" id="auth-pass" placeholder="Contraseña">
        <select id="auth-role">
            <option value="alumno">Soy Alumno</option>
            <option value="profe">Soy el Profe Pedro</option>
        </select>
        <button onclick="login()">Entrar</button>
        <button class="secondary" onclick="register()">Registrar Nuevo</button>
    </div>

    <div id="section-profe" class="card hidden">
        <h2>Panel Entrenador</h2>
        <input type="text" id="p-nombre-alumno" placeholder="Nombre alumno (ej: juan)">
        <select id="p-dia-semana">
            <option value="lunes">Lunes</option>
            <option value="martes">Martes</option>
            <option value="miercoles">Miércoles</option>
            <option value="jueves">Jueves</option>
            <option value="viernes">Viernes</option>
        </select>
        <input type="text" id="p-ejercicio" placeholder="Ejercicio">
        <input type="text" id="p-series" placeholder="Series">
        <button onclick="asignarRutina()">ASIGNAR A ESE DÍA</button>
        
        <hr style="border:0; border-top:1px solid #333; margin: 20px 0;">
        <button class="secondary" style="background: var(--accent); color: black;" onclick="verProgreso()">VER PLAN SEMANAL</button>
        
        <div id="visor-progreso" class="hidden">
            <div id="dias-selector-profe" style="display:flex; overflow-x:auto; padding:10px 0;">
                <button class="btn-day" id="btn-p-lunes" onclick="cambiarDiaVisor('lunes')">LUNES</button>
                <button class="btn-day" id="btn-p-martes" onclick="cambiarDiaVisor('martes')">MARTES</button>
                <button class="btn-day" id="btn-p-miercoles" onclick="cambiarDiaVisor('miercoles')">MIÉRCOLES</button>
                <button class="btn-day" id="btn-p-jueves" onclick="cambiarDiaVisor('jueves')">JUEVES</button>
                <button class="btn-day" id="btn-p-viernes" onclick="cambiarDiaVisor('viernes')">VIERNES</button>
            </div>
            <div id="lista-ejercicios-visor" class="visor-profe-box"></div>
        </div>
        
        <button class="secondary" onclick="logout()" style="margin-top: 30px;">CERRAR SESIÓN</button>
    </div>

    <div id="section-alumno" class="card hidden">
        <h2>Mi Plan Semanal</h2>
        <p>Atleta: <span id="display-alumno-name" style="color:var(--primary); font-weight:bold;"></span></p>
        <div id="dias-selector-alumno" style="display:flex; overflow-x:auto; padding-bottom:10px;">
            <button class="btn-day" id="btn-a-lunes" onclick="cargarDiaAlumno('lunes')">Lunes</button>
            <button class="btn-day" id="btn-a-martes" onclick="cargarDiaAlumno('martes')">Mar</button>
            <button class="btn-day" id="btn-a-miercoles" onclick="cargarDiaAlumno('miercoles')">Mie</button>
            <button class="btn-day" id="btn-a-jueves" onclick="cargarDiaAlumno('jueves')">Jue</button>
            <button class="btn-day" id="btn-a-viernes" onclick="cargarDiaAlumno('viernes')">Vie</button>
        </div>
        <div id="lista-rutina"></div>
        <button class="btn-save" style="background:var(--success); color:white; width:100%; padding:15px; border-radius:8px; margin-top:20px;" onclick="guardarRutinaAlumno()">✅ GUARDAR PROGRESO</button>
        <button class="secondary" onclick="logout()">Cerrar Sesión</button>
    </div>
</div>

<script>
    let diaActualVisor = 'lunes';
    let diaActualAlumno = 'lunes';

    function init() {
        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas')) || {};
        let users = JSON.parse(localStorage.getItem('gym_users')) || {};
        if (!users["juan"]) {
            users["juan"] = {pass: "123", role: "alumno"};
            rutinas["juan"] = {lunes:[], martes:[], miercoles:[], jueves:[], viernes:[]};
            localStorage.setItem('gym_users', JSON.stringify(users));
            localStorage.setItem('gym_rutinas', JSON.stringify(rutinas));
            localStorage.setItem('gym_historial', JSON.stringify({"juan": []}));
        }
    }
    init();

    function login() {
        const u = document.getElementById('auth-user').value.toLowerCase().trim();
        const p = document.getElementById('auth-pass').value;
        let users = JSON.parse(localStorage.getItem('gym_users')) || {};
        if (users[u] && users[u].pass === p) {
            sessionStorage.setItem('active_user', u);
            showPanel(users[u].role, u);
        } else { alert("Datos incorrectos"); }
    }

    function register() {
        const u = document.getElementById('auth-user').value.toLowerCase().trim();
        const p = document.getElementById('auth-pass').value;
        const r = document.getElementById('auth-role').value;
        let users = JSON.parse(localStorage.getItem('gym_users')) || {};
        users[u] = { pass: p, role: r };
        localStorage.setItem('gym_users', JSON.stringify(users));
        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas')) || {};
        rutinas[u] = {lunes:[], martes:[], miercoles:[], jueves:[], viernes:[]};
        localStorage.setItem('gym_rutinas', JSON.stringify(rutinas));
        alert("Usuario registrado.");
    }

    function showPanel(role, username) {
        document.getElementById('section-auth').classList.add('hidden');
        if (role === 'profe') {
            document.getElementById('section-profe').classList.remove('hidden');
        } else {
            document.getElementById('section-alumno').classList.remove('hidden');
            document.getElementById('display-alumno-name').innerText = username.toUpperCase();
            cargarDiaAlumno('lunes');
        }
    }

    function asignarRutina() {
        const al = document.getElementById('p-nombre-alumno').value.toLowerCase().trim();
        const dia = document.getElementById('p-dia-semana').value;
        const ej = document.getElementById('p-ejercicio').value;
        const se = document.getElementById('p-series').value;
        
        if (!al || !ej) return alert("Faltan datos");

        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas')) || {};
        if (!rutinas[al]) rutinas[al] = {lunes:[], martes:[], miercoles:[], jueves:[], viernes:[]};
        
        // Agregar el ejercicio al día seleccionado
        rutinas[al][dia].push({ nombre: ej, series: se, peso: "" });
        localStorage.setItem('gym_rutinas', JSON.stringify(rutinas));
        
        alert("Agregado al " + dia.toUpperCase());
        
        // Limpiar campos y forzar actualización del visor
        document.getElementById('p-ejercicio').value = "";
        document.getElementById('p-series').value = "";
        
        // Mostrar el visor si estaba oculto y actualizar el día
        document.getElementById('visor-progreso').classList.remove('hidden');
        cambiarDiaVisor(dia); 
    }

    function cambiarDiaVisor(dia) {
        diaActualVisor = dia;
        const al = document.getElementById('p-nombre-alumno').value.toLowerCase().trim();
        const lista = document.getElementById('lista-ejercicios-visor');
        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas')) || {};
        
        // Actualizar UI de botones
        document.querySelectorAll('#dias-selector-profe .btn-day').forEach(b => b.classList.remove('active-day'));
        const btn = document.getElementById('btn-p-' + dia);
        if(btn) btn.classList.add('active-day');

        const diaRutina = rutinas[al]?.[dia] || [];
        lista.innerHTML = `<h5 style="margin:0 0 10px 0; color:var(--accent)">${dia.toUpperCase()}</h5>`;
        
        if(diaRutina.length === 0) {
            lista.innerHTML += "<p style='color:#666;'>Vacio</p>";
        } else {
            diaRutina.forEach((item, index) => {
                lista.innerHTML += `
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px; border-bottom:1px solid #222; padding-bottom:5px;">
                        <span>${item.nombre} (<b>${item.peso || '-'}</b>)</span>
                        <button class="btn-danger" style="width:auto; padding:2px 8px;" onclick="eliminarEjercicio('${al}','${dia}',${index})">X</button>
                    </div>`;
            });
        }
    }

    function verProgreso() {
        const al = document.getElementById('p-nombre-alumno').value.toLowerCase().trim();
        if(!al) return alert("Ingresa nombre de alumno");
        document.getElementById('visor-progreso').classList.remove('hidden');
        cambiarDiaVisor(diaActualVisor);
    }

    function eliminarEjercicio(al, dia, idx) {
        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas'));
        rutinas[al][dia].splice(idx, 1);
        localStorage.setItem('gym_rutinas', JSON.stringify(rutinas));
        cambiarDiaVisor(dia);
    }

    function cargarDiaAlumno(dia) {
        diaActualAlumno = dia;
        const u = sessionStorage.getItem('active_user');
        const container = document.getElementById('lista-rutina');
        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas')) || {};
        
        document.querySelectorAll('#dias-selector-alumno .btn-day').forEach(b => b.classList.remove('active-day'));
        document.getElementById('btn-a-' + dia).classList.add('active-day');

        const miRutina = rutinas[u]?.[dia] || [];
        container.innerHTML = miRutina.length ? "" : "<p style='text-align:center; color:#666;'>No hay rutina para hoy.</p>";
        
        miRutina.forEach((item, index) => {
            container.innerHTML += `
                <div class="rutina-item">
                    <strong>${item.nombre}</strong> <span class="badge">${item.series}</span>
                    <input type="text" class="input-peso" data-index="${index}" placeholder="Peso hoy" value="${item.peso || ''}">
                </div>`;
        });
    }

    function guardarRutinaAlumno() {
        const u = sessionStorage.getItem('active_user');
        const inputs = document.querySelectorAll('.input-peso');
        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas'));
        let historial = JSON.parse(localStorage.getItem('gym_historial')) || {};
        const ahora = new Date().toLocaleString('es-ES', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });

        inputs.forEach(input => {
            const idx = input.getAttribute('data-index');
            const nuevoPeso = input.value;
            const ej = rutinas[u][diaActualAlumno][idx];
            if (nuevoPeso !== "" && ej.peso !== nuevoPeso) {
                historial[u].push({ fecha: ahora, ejercicio: ej.nombre, peso: nuevoPeso });
                ej.peso = nuevoPeso;
            }
        });

        localStorage.setItem('gym_rutinas', JSON.stringify(rutinas));
        localStorage.setItem('gym_historial', JSON.stringify(historial));
        alert("✅ Rutina guardada.");
    }

    function logout() { sessionStorage.clear(); location.reload(); }
</script>
</body>
</html>
