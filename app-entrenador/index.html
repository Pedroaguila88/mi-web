<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pedro Alfonso - Coach System v3.0 (Master Admin)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #d4ff00; --bg: #111; --card: #222; --text: #eee; --accent: #00d4ff; --danger: #ff4444; --success: #28a745; --dev: #ff00ff; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; }
        .container { max-width: 600px; margin: auto; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; border-top: 4px solid var(--primary); margin-bottom: 15px; }
        .dev-card { border-top-color: var(--dev); }
        h1, h2, h3 { color: var(--primary); text-align: center; margin-top: 0; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; box-sizing: border-box; font-size: 1rem; }
        input, select { background: #333; color: white; border: 1px solid #444; }
        button { background: var(--primary); color: black; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        button.secondary { background: #444; color: white; margin-top: 10px; font-size: 0.8rem; }
        .hidden { display: none; }
        .user-list-item { background: #1a1a1a; padding: 10px; border-radius: 8px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid var(--accent); }
        .badge { padding: 2px 6px; border-radius: 4px; font-size: 0.6rem; text-transform: uppercase; margin-left: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div id="section-auth" class="card">
        <h1>🏋️‍♂️ COACH SYSTEM v3.0</h1>
        <input type="text" id="auth-user" placeholder="Usuario">
        <input type="password" id="auth-pass" placeholder="Contraseña">
        <select id="auth-role">
            <option value="alumno">Soy Alumno</option>
            <option value="profe">Soy Entrenador</option>
            <option value="dev">Soy el desarrollador Pedro Alfonso</option>
        </select>
        <button onclick="login()">Entrar al Sistema</button>
    </div>

    <div id="section-dev" class="card dev-card hidden">
        <h2 style="color:var(--dev);">PANEL DESARROLLADOR</h2>
        <p style="font-size:0.8rem; text-align:center;">Control Total del Gimnasio</p>
        
        <div style="background:#000; padding:15px; border-radius:10px; margin-bottom:20px;">
            <h4 style="margin:0 0 10px 0; color:var(--primary);">Registrar Nuevo Usuario</h4>
            <input type="text" id="reg-user" placeholder="Nombre de Usuario">
            <input type="password" id="reg-pass" placeholder="Contraseña">
            <select id="reg-role">
                <option value="profe">Entrenador</option>
                <option value="alumno">Alumno</option>
            </select>
            <button onclick="masterRegister()">CREAR USUARIO</button>
        </div>

        <h4>Usuarios en el Sistema</h4>
        <div id="lista-usuarios-master"></div>
        <button class="secondary" onclick="logout()">Cerrar Sesión Master</button>
    </div>

    <div id="section-profe" class="card hidden">
        <h2 id="welcome-profe">Panel Entrenador</h2>
        <input type="text" id="p-nombre-alumno" placeholder="Nombre de tu alumno">
        <select id="p-dia-semana">
            <option value="lunes">Lunes</option><option value="martes">Martes</option>
            <option value="miercoles">Miércoles</option><option value="jueves">Jueves</option>
            <option value="viernes">Viernes</option>
        </select>
        <input type="text" id="p-ejercicio" placeholder="Ejercicio">
        <input type="text" id="p-series" placeholder="Series (ej: 4x10)">
        <button onclick="asignarRutina()">ASIGNAR RUTINA</button>
        <button class="secondary" onclick="verProgreso()">GESTIONAR MIS ALUMNOS</button>
        
        <div id="visor-progreso" class="hidden" style="margin-top:15px; background:#000; padding:10px; border-radius:10px;">
            <div id="lista-ejercicios-visor"></div>
        </div>
        <button class="secondary" onclick="logout()">Cerrar Sesión</button>
    </div>

    <div id="section-alumno" class="card hidden">
        <h2>Mi Plan Semanal</h2>
        <p>Atleta: <span id="display-alumno-name" style="color:var(--primary); font-weight:bold;"></span></p>
        <div id="lista-rutina"></div>
        <button class="secondary" onclick="logout()">Cerrar Sesión</button>
    </div>
</div>

<script>
    // --- INICIALIZACIÓN MAESTRA ---
    function init() {
        let users = JSON.parse(localStorage.getItem('gym_users')) || {};
        // Crear usuario Desarrollador si no existe
        if (!users["pedro alfonso"]) {
            users["pedro alfonso"] = { 
                pass: "0994rocio", 
                role: "dev", 
                created_by: "system" 
            };
            localStorage.setItem('gym_users', JSON.stringify(users));
        }
    }
    init();

    // --- AUTENTICACIÓN ---
    function login() {
        const u = document.getElementById('auth-user').value.toLowerCase().trim();
        const p = document.getElementById('auth-pass').value;
        const r_selected = document.getElementById('auth-role').value;
        let users = JSON.parse(localStorage.getItem('gym_users')) || {};
        
        if (users[u] && users[u].pass === p && users[u].role === r_selected) {
            sessionStorage.setItem('active_user', u);
            sessionStorage.setItem('user_role', users[u].role);
            showPanel(users[u].role, u);
        } else { alert("Datos incorrectos o rol equivocado"); }
    }

    function showPanel(role, username) {
        document.getElementById('section-auth').classList.add('hidden');
        if (role === 'dev') {
            document.getElementById('section-dev').classList.remove('hidden');
            renderMasterUsers();
        } else if (role === 'profe') {
            document.getElementById('section-profe').classList.remove('hidden');
            document.getElementById('welcome-profe').innerText = `Profe: ${username.toUpperCase()}`;
        } else {
            document.getElementById('section-alumno').classList.remove('hidden');
            document.getElementById('display-alumno-name').innerText = username.toUpperCase();
            cargarRutinaAlumno();
        }
    }

    // --- LÓGICA DEL DESARROLLADOR (MASTER) ---
    function masterRegister() {
        const u = document.getElementById('reg-user').value.toLowerCase().trim();
        const p = document.getElementById('reg-pass').value;
        const r = document.getElementById('reg-role').value;
        const currentDev = sessionStorage.getItem('active_user');

        if(!u || !p) return alert("Faltan datos");
        let users = JSON.parse(localStorage.getItem('gym_users')) || {};
        if(users[u]) return alert("Usuario ya existe");

        users[u] = { pass: p, role: r, created_by: currentDev };
        localStorage.setItem('gym_users', JSON.stringify(users));
        
        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas')) || {};
        rutinas[u] = { lunes:[], martes:[], miercoles:[], jueves:[], viernes:[] };
        localStorage.setItem('gym_rutinas', JSON.stringify(rutinas));

        alert(`Usuario ${u} creado exitosamente.`);
        document.getElementById('reg-user').value = "";
        document.getElementById('reg-pass').value = "";
        renderMasterUsers();
    }

    function renderMasterUsers() {
        const container = document.getElementById('lista-usuarios-master');
        const users = JSON.parse(localStorage.getItem('gym_users')) || {};
        container.innerHTML = "";

        for (let u in users) {
            if (u === "pedro alfonso") continue; // No borrarse a sí mismo
            const color = users[u].role === 'profe' ? 'var(--accent)' : 'var(--primary)';
            container.innerHTML += `
                <div class="user-list-item">
                    <span>
                        <strong>${u.toUpperCase()}</strong> 
                        <span class="badge" style="background:${color}">${users[u].role}</span>
                        <br><small style="font-size:0.6rem; color:#888;">Por: ${users[u].created_by}</small>
                    </span>
                    <button onclick="masterDelete('${u}')" style="width:auto; padding:5px 10px; background:var(--danger); color:white; font-size:0.7rem;">ELIMINAR</button>
                </div>`;
        }
    }

    function masterDelete(username) {
        if(!confirm(`¿Estás seguro de eliminar a ${username}? Se perderán todos sus datos.`)) return;
        let users = JSON.parse(localStorage.getItem('gym_users'));
        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas'));
        
        delete users[username];
        if(rutinas[username]) delete rutinas[username];
        
        localStorage.setItem('gym_users', JSON.stringify(users));
        localStorage.setItem('gym_rutinas', JSON.stringify(rutinas));
        renderMasterUsers();
    }

    // --- LÓGICA DE ENTRENADOR Y ALUMNO (IGUAL A V2.9) ---
    function asignarRutina() {
        const al = document.getElementById('p-nombre-alumno').value.toLowerCase().trim();
        const users = JSON.parse(localStorage.getItem('gym_users')) || {};
        const profe = sessionStorage.getItem('active_user');

        if (!users[al] || users[al].created_by !== profe) {
            return alert("Este alumno no existe o no fue registrado por ti.");
        }

        const dia = document.getElementById('p-dia-semana').value;
        const ej = document.getElementById('p-ejercicio').value;
        const se = document.getElementById('p-series').value;

        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas'));
        rutinas[al][dia].push({ nombre: ej, series: se });
        localStorage.setItem('gym_rutinas', JSON.stringify(rutinas));
        alert("¡Asignado!");
    }

    function logout() { sessionStorage.clear(); location.reload(); }
</script>
</body>
</html>
