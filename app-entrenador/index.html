<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pedro Alfonso - Coach System v4.0</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #d4ff00; --bg: #111; --card: #222; --text: #eee; --accent: #00d4ff; --danger: #ff4444; --success: #28a745; --dev: #ff00ff; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; }
        .container { max-width: 600px; margin: auto; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; border-top: 4px solid var(--primary); margin-bottom: 15px; }
        .dev-card { border-top-color: var(--dev); }
        h1, h2, h3 { color: var(--primary); text-align: center; margin-top: 0; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; box-sizing: border-box; font-size: 1rem; }
        input, select { background: #333; color: white; border: 1px solid #444; }
        button { background: var(--primary); color: black; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        button.secondary { background: #444; color: white; margin-top: 10px; font-size: 0.8rem; }
        button.btn-day { background: #333; color: white; width: auto; padding: 8px 12px; font-size: 0.7rem; margin-right: 5px; border: 1px solid #444; margin-bottom: 5px; }
        button.active-day { background: var(--primary); color: black; border-color: var(--primary); }
        .hidden { display: none; }
        .rutina-item { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-top: 10px; border-left: 4px solid var(--primary); }
        .badge { background: var(--primary); color: black; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        .gif-container { width: 100%; border-radius: 10px; overflow: hidden; margin-top: 10px; border: 1px solid #444; display: none; }
        .gif-container img { width: 100%; display: block; background: #000; }
        .btn-ver-gif { background: #333; color: var(--accent); font-size: 0.7rem; padding: 8px; margin-top: 10px; width: auto; display: inline-block; cursor: pointer; border-radius: 5px; border: 1px solid var(--accent); font-weight: bold; }
        .chart-wrap { background: #1a1a1a; padding: 15px; border-radius: 12px; margin-top: 10px; height: 200px; }
        .historial-box { margin-top: 10px; max-height: 120px; overflow-y: auto; background: #111; border-radius: 8px; padding: 8px; border: 1px solid #444; }
        .historial-item { font-size: 0.65rem; padding: 4px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; }
        label { font-size: 0.8rem; color: var(--accent); font-weight: bold; margin-top: 5px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <div id="section-auth" class="card">
        <h1>🏋️‍♂️ COACH SYSTEM v4.0</h1>
        <input type="text" id="auth-user" placeholder="Usuario">
        <input type="password" id="auth-pass" placeholder="Contraseña">
        <select id="auth-role">
            <option value="alumno">Soy Alumno</option>
            <option value="profe">Soy Entrenador</option>
            <option value="dev">Soy el desarrollador Pedro Alfonso</option>
        </select>
        <button onclick="login()">Entrar</button>
    </div>

    <div id="section-dev" class="card dev-card hidden">
        <h2 style="color:var(--dev);">MASTER PANEL</h2>
        <div style="background:#000; padding:15px; border-radius:10px; margin-bottom:15px;">
            <input type="text" id="reg-user" placeholder="Usuario Nuevo">
            <input type="password" id="reg-pass" placeholder="Contraseña">
            <select id="reg-role"><option value="profe">Entrenador</option><option value="alumno">Alumno</option></select>
            <button onclick="masterRegister()">CREAR USUARIO</button>
        </div>
        <div id="lista-usuarios-master"></div>
        <button class="secondary" onclick="logout()">Cerrar Sesión Master</button>
    </div>

    <div id="section-profe" class="card hidden">
        <h2 id="welcome-profe">Panel Profe</h2>
        <input type="text" id="p-nombre-alumno" placeholder="Nombre del alumno">
        
        <label>1. Día de la Semana:</label>
        <select id="p-dia-semana">
            <option value="lunes">Lunes</option><option value="martes">Martes</option><option value="miercoles">Miércoles</option><option value="jueves">Jueves</option><option value="viernes">Viernes</option>
        </select>

        <label>2. Nombre del Ejercicio:</label>
        <input type="text" id="p-ejercicio-nombre" placeholder="Ej: Press con Mancuernas">

        <label>3. Seleccionar Técnica (GIF):</label>
        <select id="p-gif-selector">
            <option value="">-- Sin GIF --</option>
            <option value="press_banca_barra.gif">Press de Banca Barra</option>
            <option value="apertura_banca_mancuerna.gif">Apertura Banca Mancuerna</option>
        </select>
        
        <label>4. Volumen de Trabajo:</label>
        <input type="text" id="p-series" placeholder="Series y Reps (Ej: 4x12)">
        
        <button onclick="asignarRutina()">ASIGNAR RUTINA COMPLETA</button>
        <button class="secondary" style="background:var(--accent); color:black;" onclick="verProgreso()">GESTIONAR PLAN & GRÁFICOS</button>
        
        <div id="visor-progreso" class="hidden">
            <div id="lista-ejercicios-visor" class="card" style="background:#000;"></div>
            <div class="chart-wrap"><canvas id="progresoChart"></canvas></div>
            <div id="items-historial" class="historial-box"></div>
        </div>
        <button class="secondary" onclick="logout()">Cerrar Sesión</button>
    </div>

    <div id="section-alumno" class="card hidden">
        <h2 id="welcome-alumno">Mi Plan</h2>
        <div id="dias-selector-alumno" style="display:flex; overflow-x:auto; padding-bottom:10px;">
            <button class="btn-day active-day" onclick="cargarDiaAlumno('lunes', this)">LUN</button>
            <button class="btn-day" onclick="cargarDiaAlumno('martes', this)">MAR</button>
            <button class="btn-day" onclick="cargarDiaAlumno('miercoles', this)">MIE</button>
            <button class="btn-day" onclick="cargarDiaAlumno('jueves', this)">JUE</button>
            <button class="btn-day" onclick="cargarDiaAlumno('viernes', this)">VIE</button>
        </div>
        <div id="lista-rutina"></div>
        <button style="background:var(--success); color:white; margin-top:15px;" onclick="guardarProgresoAlumno()">✅ GUARDAR ENTRENAMIENTO</button>
        <button class="secondary" onclick="logout()">Cerrar Sesión</button>
    </div>
</div>

<script>
    // --- LIBRERÍA MULTIMEDIA ---
    // Aquí puedes agregar más GIFs a medida que los subas a GitHub
    const libreriaGifs = {
        "press_banca_barra.gif": "Press de Banca Barra",
        "apertura_banca_mancuerna.gif": "Apertura Banca Mancuerna"
    };

    let miGrafico = null;
    let diaActualVisor = 'lunes';
    let diaActualAlumno = 'lunes';

    function init() {
        let users = JSON.parse(localStorage.getItem('gym_users')) || {};
        if (!users["pedro alfonso"]) {
            users["pedro alfonso"] = { pass: "0994rocio", role: "dev", created_by: "system" };
            localStorage.setItem('gym_users', JSON.stringify(users));
        }
    }
    init();

    function login(u_ext, p_ext, r_ext) {
        const u = u_ext || document.getElementById('auth-user').value.toLowerCase().trim();
        const p = p_ext || document.getElementById('auth-pass').value;
        const r = r_ext || document.getElementById('auth-role').value;
        let users = JSON.parse(localStorage.getItem('gym_users')) || {};
        if (users[u] && users[u].pass === p) {
            sessionStorage.setItem('active_user', u);
            sessionStorage.setItem('user_role', r);
            renderDashboard(r, u);
        } else { if(!u_ext) alert("Datos incorrectos"); }
    }

    function renderDashboard(role, username) {
        document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
        if (role === 'dev') {
            document.getElementById('section-dev').classList.remove('hidden');
            renderMasterUsers();
        } else if (role === 'profe') {
            document.getElementById('section-profe').classList.remove('hidden');
            document.getElementById('welcome-profe').innerText = `PROFE: ${username.toUpperCase()}`;
        } else {
            document.getElementById('section-alumno').classList.remove('hidden');
            document.getElementById('welcome-alumno').innerText = `ATLETA: ${username.toUpperCase()}`;
            cargarDiaAlumno('lunes');
        }
    }

    function asignarRutina() {
        const al = document.getElementById('p-nombre-alumno').value.toLowerCase().trim();
        const dia = document.getElementById('p-dia-semana').value;
        const ejNombre = document.getElementById('p-ejercicio-nombre').value;
        const gifSeleccionado = document.getElementById('p-gif-selector').value;
        const se = document.getElementById('p-series').value;

        if (!al || !ejNombre) return alert("El nombre del alumno y del ejercicio son obligatorios");

        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas')) || {};
        if(!rutinas[al]) rutinas[al] = { lunes:[], martes:[], miercoles:[], jueves:[], viernes:[] };

        rutinas[al][dia].push({ 
            nombre: ejNombre, 
            series: se, 
            peso: "", 
            gif: gifSeleccionado 
        });

        localStorage.setItem('gym_rutinas', JSON.stringify(rutinas));
        alert("¡Ejercicio asignado con éxito!");
        document.getElementById('p-ejercicio-nombre').value = "";
    }

    function cargarDiaAlumno(dia, btn) {
        diaActualAlumno = dia;
        const u = sessionStorage.getItem('active_user');
        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas')) || {};
        document.querySelectorAll('#dias-selector-alumno .btn-day').forEach(b => b.classList.remove('active-day'));
        if(btn) btn.classList.add('active-day');

        const container = document.getElementById('lista-rutina');
        const r = (rutinas[u] && rutinas[u][dia]) ? rutinas[u][dia] : [];
        container.innerHTML = r.length ? "" : "<p style='text-align:center;'>Día de Descanso / Cardio</p>";
        
        r.forEach((item, idx) => {
            container.innerHTML += `
            <div class="rutina-item">
                <strong>${item.nombre}</strong> <span class="badge">${item.series}</span>
                <br>
                ${item.gif ? `
                <div class="btn-ver-gif" onclick="toggleGif(${idx})">📹 VER TÉCNICA</div>
                <div id="gif-${idx}" class="gif-container">
                    <img src="${item.gif}" alt="Cargando técnica...">
                </div>` : ''}
                <input type="number" class="peso-input" data-idx="${idx}" placeholder="Kg levantados" value="${item.peso || ''}">
            </div>`;
        });
    }

    function toggleGif(id) {
        const el = document.getElementById(`gif-${id}`);
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }

    function verProgreso() {
        const al = document.getElementById('p-nombre-alumno').value.toLowerCase().trim();
        if(!al) return alert("Escribe el nombre del alumno");
        document.getElementById('visor-progreso').classList.remove('hidden');
        cambiarDiaVisor('lunes');
        setTimeout(() => { dibujarGrafico(al); renderHistorial(al); }, 100);
    }

    function cambiarDiaVisor(dia, btn) {
        diaActualVisor = dia;
        const al = document.getElementById('p-nombre-alumno').value.toLowerCase().trim();
        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas')) || {};
        document.querySelectorAll('#dias-selector-profe .btn-day').forEach(b => b.classList.remove('active-day'));
        if(btn) btn.classList.add('active-day');
        const lista = document.getElementById('lista-ejercicios-visor');
        const r = rutinas[al][dia] || [];
        lista.innerHTML = `<h5>${dia.toUpperCase()}</h5>`;
        r.forEach((item, idx) => {
            lista.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:5px; font-size:0.8rem;">
                <span>${item.nombre}</span>
                <b>${item.peso || '-'}kg</b>
                <button onclick="eliminarEjercicio('${al}','${dia}',${idx})" style="width:auto; padding:2px 5px; background:var(--danger); color:white; font-size:0.6rem;">X</button>
            </div>`;
        });
    }

    function eliminarEjercicio(al, dia, idx) {
        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas'));
        rutinas[al][dia].splice(idx, 1);
        localStorage.setItem('gym_rutinas', JSON.stringify(rutinas));
        cambiarDiaVisor(dia);
    }

    function dibujarGrafico(al) {
        const ctx = document.getElementById('progresoChart').getContext('2d');
        const h = JSON.parse(localStorage.getItem('gym_historial')) || {};
        const datos = h[al] || [];
        const labels = datos.length ? datos.slice(-10).map(d => d.fecha) : ['-'];
        const pesos = datos.length ? datos.slice(-10).map(d => parseFloat(d.peso)) : [0];
        if (miGrafico) miGrafico.destroy();
        miGrafico = new Chart(ctx, {
            type: 'line',
            data: { labels: labels, datasets: [{ label: 'Kg', data: pesos, borderColor: '#00d4ff', tension: 0.3, fill: true, backgroundColor: 'rgba(0,212,255,0.1)' }] },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    function renderHistorial(al) {
        const container = document.getElementById('items-historial');
        const h = JSON.parse(localStorage.getItem('gym_historial')) || {};
        const regs = h[al] || [];
        container.innerHTML = "<strong>BITÁCORA DE CARGAS:</strong><br>";
        [...regs].reverse().slice(0,10).forEach(r => {
            container.innerHTML += `<div class="historial-item"><span>${r.fecha}</span> <span>${r.ejercicio}</span> <b>${r.peso}kg</b></div>`;
        });
    }

    function guardarProgresoAlumno() {
        const u = sessionStorage.getItem('active_user');
        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas'));
        let historial = JSON.parse(localStorage.getItem('gym_historial')) || {};
        const inputs = document.querySelectorAll('.peso-input');
        const fecha = new Date().toLocaleDateString('es-PY', {day:'2-digit', month:'2-digit'});
        if(!historial[u]) historial[u] = [];
        inputs.forEach(input => {
            const idx = input.getAttribute('data-idx');
            const nP = input.value;
            const ej = rutinas[u][diaActualAlumno][idx];
            if (nP && nP !== ej.peso) {
                historial[u].push({ fecha: fecha, ejercicio: ej.nombre, peso: nP });
                ej.peso = nP;
            }
        });
        localStorage.setItem('gym_rutinas', JSON.stringify(rutinas));
        localStorage.setItem('gym_historial', JSON.stringify(historial));
        alert("¡Entrenamiento guardado!");
        cargarDiaAlumno(diaActualAlumno);
    }

    function renderMasterUsers() {
        const container = document.getElementById('lista-usuarios-master');
        const users = JSON.parse(localStorage.getItem('gym_users')) || {};
        container.innerHTML = "<h4>Gestión de Accesos:</h4>";
        for (let u in users) {
            if (u === "pedro alfonso") continue;
            container.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:5px; background:#333; padding:8px; border-radius:8px; align-items:center;">
                <span>${u.toUpperCase()}</span>
                <div>
                    <button onclick="login('${u}','${users[u].pass}','${users[u].role}')" style="width:auto; padding:5px; background:var(--success); color:white; font-size:0.6rem;">ENTRAR</button>
                    <button onclick="masterDelete('${u}')" style="width:auto; padding:5px; background:var(--danger); color:white; font-size:0.6rem; margin-left:4px;">BORRAR</button>
                </div>
            </div>`;
        }
    }

    function masterRegister() {
        const u = document.getElementById('reg-user').value.toLowerCase().trim();
        const p = document.getElementById('reg-pass').value;
        const r = document.getElementById('reg-role').value;
        if(!u || !p) return;
        let users = JSON.parse(localStorage.getItem('gym_users')) || {};
        users[u] = { pass: p, role: r, created_by: sessionStorage.getItem('active_user') };
        localStorage.setItem('gym_users', JSON.stringify(users));
        renderMasterUsers();
    }

    function masterDelete(u) {
        if(confirm(`¿Borrar permanentemente a ${u}?`)) {
            let users = JSON.parse(localStorage.getItem('gym_users'));
            delete users[u];
            localStorage.setItem('gym_users', JSON.stringify(users));
            renderMasterUsers();
        }
    }

    function logout() { sessionStorage.clear(); location.reload(); }
</script>
</body>
</html>
