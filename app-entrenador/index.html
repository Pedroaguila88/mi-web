<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pedro Alfonso - Coach System v2.9 (Security Update)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #d4ff00; --bg: #111; --card: #222; --text: #eee; --accent: #00d4ff; --danger: #ff4444; --success: #28a745; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; }
        .container { max-width: 600px; margin: auto; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; border-top: 4px solid var(--primary); margin-bottom: 15px; }
        h1, h2, h3 { color: var(--primary); text-align: center; margin-top: 0; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; box-sizing: border-box; font-size: 1rem; }
        input, select { background: #333; color: white; border: 1px solid #444; }
        button { background: var(--primary); color: black; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        button.secondary { background: #444; color: white; margin-top: 10px; font-size: 0.8rem; }
        button.btn-day { background: #333; color: white; width: auto; padding: 8px 12px; font-size: 0.7rem; margin-right: 5px; border: 1px solid #444; }
        button.active-day { background: var(--primary); color: black; border-color: var(--primary); }
        .hidden { display: none; }
        .rutina-item { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-top: 10px; border-left: 4px solid var(--primary); }
        .badge { background: var(--primary); color: black; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        .visor-profe-box { background: #000; padding: 15px; border-radius: 10px; margin-top: 15px; border: 1px solid var(--accent); }
        .chart-container { background: #1a1a1a; padding: 15px; border-radius: 12px; margin-top: 20px; border: 1px solid #333; height: 350px; }
        .sub-ventana-historial { background: #151515; border: 1px solid #333; padding: 10px; border-radius: 10px; margin-top: 15px; max-height: 200px; overflow-y: auto; }
        .registro-historial { font-size: 0.7rem; padding: 5px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; }
        .volumen-badge { background: var(--accent); color: black; padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; display: inline-block; margin: 10px 0; }
        .btn-action { width: auto; padding: 4px 10px; font-size: 0.8rem; margin-left: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div id="section-auth" class="card">
        <h1>🏋️‍♂️ COACH SYSTEM v2.9</h1>
        <p style="text-align:center; font-size:0.8rem; color:var(--accent);">Seguridad por Profe Activa</p>
        <input type="text" id="auth-user" placeholder="Usuario">
        <input type="password" id="auth-pass" placeholder="Contraseña">
        <select id="auth-role">
            <option value="alumno">Soy Alumno</option>
            <option value="profe">Soy Entrenador</option>
        </select>
        <button onclick="login()">Entrar</button>
        <button class="secondary" onclick="register()">Registrar Nuevo</button>
    </div>

    <div id="section-profe" class="card hidden">
        <h2 id="welcome-profe">Panel Entrenador</h2>
        <input type="text" id="p-nombre-alumno" placeholder="Nombre alumno a buscar/crear">
        <select id="p-dia-semana">
            <option value="lunes">Lunes</option><option value="martes">Martes</option>
            <option value="miercoles">Miércoles</option><option value="jueves">Jueves</option>
            <option value="viernes">Viernes</option>
        </select>
        <input type="text" id="p-ejercicio" placeholder="Ejercicio">
        <input type="text" id="p-series" placeholder="Series (ej: 4x10)">
        <button onclick="asignarRutina()">ASIGNAR AHORA</button>
        
        <hr style="border:0; border-top:1px solid #333; margin: 20px 0;">
        <button class="secondary" style="background: var(--accent); color: black;" onclick="verProgreso()">GESTIONAR MIS ALUMNOS</button>
        
        <div id="visor-progreso" class="hidden">
            <div id="dias-selector-profe" style="display:flex; overflow-x:auto; padding:10px 0;">
                <button class="btn-day" onclick="cambiarDiaVisor('lunes', this)">LUN</button>
                <button class="btn-day" onclick="cambiarDiaVisor('martes', this)">MAR</button>
                <button class="btn-day" onclick="cambiarDiaVisor('miercoles', this)">MIE</button>
                <button class="btn-day" onclick="cambiarDiaVisor('jueves', this)">JUE</button>
                <button class="btn-day" onclick="cambiarDiaVisor('viernes', this)">VIE</button>
            </div>
            
            <div id="lista-ejercicios-visor" class="visor-profe-box"></div>
            <button onclick="cerrarVisor()" class="secondary" style="font-size:0.7rem;">Cerrar Visor</button>
        </div>
        <button class="secondary" onclick="logout()">Cerrar Sesión</button>
    </div>

    <div id="section-alumno" class="card hidden">
        <h2>Mi Plan Semanal</h2>
        <p>Atleta: <span id="display-alumno-name" style="color:var(--primary); font-weight:bold;"></span></p>
        <div id="dias-selector-alumno" style="display:flex; overflow-x:auto; padding-bottom:10px;">
            <button class="btn-day active-day" onclick="cargarDiaAlumno('lunes', this)">Lun</button>
            <button class="btn-day" onclick="cargarDiaAlumno('martes', this)">Mar</button>
            <button class="btn-day" onclick="cargarDiaAlumno('miercoles', this)">Mie</button>
            <button class="btn-day" onclick="cargarDiaAlumno('jueves', this)">Jue</button>
            <button class="btn-day" onclick="cargarDiaAlumno('viernes', this)">Vie</button>
        </div>
        <div id="lista-rutina"></div>
        <div id="volumen-dia" class="volumen-badge hidden"></div>
        <button style="background:var(--success); color:white; margin-top:20px; padding:15px; width:100%; border-radius:8px;" onclick="guardarRutinaAlumno()">✅ GUARDAR PROGRESO</button>
        <button class="secondary" onclick="logout()">Cerrar Sesión</button>
    </div>
</div>

<script>
    let miGrafico = null;
    let diaActualVisor = 'lunes';
    let diaActualAlumno = 'lunes';
    const coloresPalette = ['#d4ff00', '#00d4ff', '#ff4444', '#ff8800', '#aa00ff'];

    // --- SEGURIDAD Y PERMISOS ---
    function login() {
        const u = document.getElementById('auth-user').value.toLowerCase().trim();
        const p = document.getElementById('auth-pass').value;
        let users = JSON.parse(localStorage.getItem('gym_users')) || {};
        
        if (users[u] && users[u].pass === p) {
            sessionStorage.setItem('active_user', u);
            sessionStorage.setItem('user_role', users[u].role);
            showPanel(users[u].role, u);
        } else { alert("Datos incorrectos o usuario inexistente"); }
    }

    function register() {
        const u = document.getElementById('auth-user').value.toLowerCase().trim();
        const p = document.getElementById('auth-pass').value;
        const r = document.getElementById('auth-role').value;
        const currentProfe = sessionStorage.getItem('active_user');

        if(!u || !p) return alert("Faltan datos");
        
        let users = JSON.parse(localStorage.getItem('gym_users')) || {};
        if(users[u]) return alert("El usuario ya existe");

        // Guardamos quién creó al usuario
        users[u] = { 
            pass: p, 
            role: r, 
            created_by: (r === 'alumno') ? currentProfe : 'admin' 
        };
        
        localStorage.setItem('gym_users', JSON.stringify(users));
        
        // Inicializar rutinas
        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas')) || {};
        rutinas[u] = { lunes:[], martes:[], miercoles:[], jueves:[], viernes:[] };
        localStorage.setItem('gym_rutinas', JSON.stringify(rutinas));
        
        alert(`Usuario ${u} registrado correctamente.`);
    }

    function showPanel(role, username) {
        document.getElementById('section-auth').classList.add('hidden');
        if (role === 'profe') {
            document.getElementById('section-profe').classList.remove('hidden');
            document.getElementById('welcome-profe').innerText = `Profe: ${username.toUpperCase()}`;
        } else {
            document.getElementById('section-alumno').classList.remove('hidden');
            document.getElementById('display-alumno-name').innerText = username.toUpperCase();
            cargarDiaAlumno('lunes');
        }
    }

    // --- LÓGICA DE ENTRENADOR (AISLADA) ---
    function verificarPermisoAlumno(alumnoNombre) {
        const profeActual = sessionStorage.getItem('active_user');
        const users = JSON.parse(localStorage.getItem('gym_users')) || {};
        
        if (!users[alumnoNombre]) {
            alert("El alumno no existe. Regístralo primero.");
            return false;
        }
        if (users[alumnoNombre].created_by !== profeActual) {
            alert("No tienes acceso a este alumno (pertenece a otro entrenador).");
            return false;
        }
        return true;
    }

    function asignarRutina() {
        const al = document.getElementById('p-nombre-alumno').value.toLowerCase().trim();
        if (!verificarPermisoAlumno(al)) return;

        const dia = document.getElementById('p-dia-semana').value;
        const ej = document.getElementById('p-ejercicio').value;
        const se = document.getElementById('p-series').value;

        if (!ej) return alert("Escribe el ejercicio");

        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas'));
        rutinas[al][dia].push({ nombre: ej, series: se, peso: "" });
        localStorage.setItem('gym_rutinas', JSON.stringify(rutinas));
        
        alert("¡Ejercicio asignado!");
        document.getElementById('p-ejercicio').value = "";
        if(!document.getElementById('visor-progreso').classList.contains('hidden')) cambiarDiaVisor(diaActualVisor);
    }

    function cambiarDiaVisor(dia, btn) {
        diaActualVisor = dia;
        const al = document.getElementById('p-nombre-alumno').value.toLowerCase().trim();
        const lista = document.getElementById('lista-ejercicios-visor');
        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas')) || {};
        
        document.querySelectorAll('#dias-selector-profe .btn-day').forEach(b => b.classList.remove('active-day'));
        if(btn) btn.classList.add('active-day');

        const diaRutina = rutinas[al] && rutinas[al][dia] ? rutinas[al][dia] : [];
        lista.innerHTML = `<h5 style="color:var(--accent); margin:0;">${dia.toUpperCase()}</h5>`;
        
        if(diaRutina.length === 0) {
            lista.innerHTML += "<p style='font-size:0.8rem;'>Sin ejercicios este día.</p>";
        } else {
            diaRutina.forEach((item, index) => {
                lista.innerHTML += `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px; border-bottom:1px solid #222; padding-bottom:5px;">
                    <span style="font-size:0.85rem;">${item.nombre} (${item.series})</span>
                    <div>
                        <button onclick="modificarEjercicio('${al}','${dia}',${index})" class="btn-action" style="background:var(--accent); color:black;">M</button>
                        <button onclick="eliminarEjercicio('${al}','${dia}',${index})" class="btn-action" style="background:var(--danger); color:white;">X</button>
                    </div>
                </div>`;
            });
        }
    }

    function verProgreso() {
        const al = document.getElementById('p-nombre-alumno').value.toLowerCase().trim();
        if (!al) return alert("Escribe el nombre del alumno");
        if (!verificarPermisoAlumno(al)) return;

        document.getElementById('visor-progreso').classList.remove('hidden');
        cambiarDiaVisor(diaActualVisor);
    }

    function cerrarVisor() { document.getElementById('visor-progreso').classList.add('hidden'); }

    // --- LÓGICA DE ALUMNO ---
    function cargarDiaAlumno(dia, btn) {
        diaActualAlumno = dia;
        const u = sessionStorage.getItem('active_user');
        const container = document.getElementById('lista-rutina');
        const volBox = document.getElementById('volumen-dia');
        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas')) || {};
        
        document.querySelectorAll('#dias-selector-alumno .btn-day').forEach(b => b.classList.remove('active-day'));
        if(btn) btn.classList.add('active-day');

        const miRutina = (rutinas[u] && rutinas[u][dia]) ? rutinas[u][dia] : [];
        container.innerHTML = miRutina.length ? "" : "<p style='text-align:center; padding:20px; font-size:0.9rem;'>Hoy es día de recuperación 🛌</p>";
        
        let volTotal = 0;
        miRutina.forEach((item, index) => {
            volTotal += (parseFloat(item.peso) || 0) * (parseInt(item.series) || 0);
            container.innerHTML += `<div class="rutina-item"><strong>${item.nombre}</strong> <span class="badge">${item.series}</span><input type="number" class="input-peso" data-index="${index}" placeholder="Kg levantados" value="${item.peso || ''}"></div>`;
        });
        if(volTotal > 0) { volBox.classList.remove('hidden'); volBox.innerText = `Carga Total: ${volTotal}kg`; } else { volBox.classList.add('hidden'); }
    }

    function guardarRutinaAlumno() {
        const u = sessionStorage.getItem('active_user');
        const inputs = document.querySelectorAll('.input-peso');
        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas'));
        const ahora = new Date().toLocaleString('es-ES', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });

        inputs.forEach(input => {
            const idx = input.getAttribute('data-index');
            rutinas[u][diaActualAlumno][idx].peso = input.value;
        });
        
        localStorage.setItem('gym_rutinas', JSON.stringify(rutinas));
        alert("✅ Entrenamiento guardado.");
        cargarDiaAlumno(diaActualAlumno);
    }

    function eliminarEjercicio(al, dia, idx) {
        if(!confirm("¿Eliminar ejercicio?")) return;
        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas'));
        rutinas[al][dia].splice(idx, 1);
        localStorage.setItem('gym_rutinas', JSON.stringify(rutinas));
        cambiarDiaVisor(dia);
    }

    function modificarEjercicio(al, dia, idx) {
        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas'));
        const ej = rutinas[al][dia][idx];
        const nN = prompt("Nombre:", ej.nombre);
        const nS = prompt("Series:", ej.series);
        if (nN !== null && nS !== null) {
            rutinas[al][dia][idx].nombre = nN || ej.nombre;
            rutinas[al][dia][idx].series = nS || ej.series;
            localStorage.setItem('gym_rutinas', JSON.stringify(rutinas));
            cambiarDiaVisor(dia);
        }
    }

    function logout() { sessionStorage.clear(); location.reload(); }
</script>
</body>
</html>
