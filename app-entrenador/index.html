<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedro Alfonso - Coach System v1.8</title>
    <style>
        :root { --primary: #d4ff00; --bg: #111; --card: #222; --text: #eee; --accent: #00d4ff; --danger: #ff4444; --success: #28a745; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        .card { background: var(--card); padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-top: 4px solid var(--primary); margin-bottom: 20px; }
        h1, h2, h3 { color: var(--primary); text-align: center; margin-top: 0; }
        label { display: block; font-size: 0.75rem; color: #888; margin-top: 10px; text-transform: uppercase; font-weight: bold; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; box-sizing: border-box; font-size: 1rem; }
        input, select { background: #333; color: white; outline: none; border: 1px solid #444; }
        button { background: var(--primary); color: black; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        button:hover { background: #b8de00; transform: translateY(-2px); }
        button.secondary { background: #444; color: white; margin-top: 10px; font-size: 0.8rem; }
        button.btn-save { background: var(--success); color: white; margin-top: 20px; }
        button.btn-danger { background: var(--danger); color: white; padding: 5px 10px; width: auto; font-size: 0.7rem; margin: 0; border-radius: 4px; }
        .hidden { display: none; }
        .rutina-item { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-top: 10px; border-left: 4px solid var(--primary); }
        .badge { background: var(--primary); color: black; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .visor-alumno { background: #000; padding: 15px; border-radius: 10px; margin-top: 20px; border: 2px solid var(--accent); }
        .item-progreso { border-bottom: 1px solid #333; padding: 12px 0; display: flex; flex-direction: column; gap: 5px; }
        .sub-ventana-historial { background: #151515; border: 1px solid #333; padding: 15px; border-radius: 10px; margin-top: 15px; max-height: 250px; overflow-y: auto; }
        .registro-historial { font-size: 0.75rem; padding: 8px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; }
        .txt-fecha-h { color: var(--accent); }
        .txt-peso-h { color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div id="section-auth" class="card">
        <h1>🏋️‍♂️ COACH SYSTEM PRO</h1>
        <input type="text" id="auth-user" placeholder="Usuario">
        <input type="password" id="auth-pass" placeholder="Contraseña">
        <select id="auth-role">
            <option value="alumno">Soy Alumno</option>
            <option value="profe">Soy el Profe Pedro</option>
        </select>
        <button onclick="login()">Entrar</button>
        <button class="secondary" onclick="register()">Registrar Nuevo</button>
    </div>

    <div id="section-profe" class="card hidden">
        <h2>Panel Entrenador</h2>
        <h3>Asignar Ejercicio</h3>
        <input type="text" id="p-nombre-alumno" placeholder="Nombre del alumno (ej: juan)">
        <input type="text" id="p-ejercicio" placeholder="Ejercicio">
        <input type="text" id="p-series" placeholder="Series (ej: 4x12)">
        <button onclick="asignarRutina()">Agregar a la Rutina</button>
        
        <hr style="border:0; border-top:1px solid #333; margin: 20px 0;">
        
        <h3>Seguimiento y Bitácora</h3>
        <button class="secondary" style="background: var(--accent); color: black;" onclick="verProgreso()">Consultar Rutina Actual</button>
        <div id="visor-progreso" class="visor-alumno hidden"></div>
        
        <div id="sub-ventana-historial" class="hidden">
            <h4 style="color:var(--accent); text-align:center; margin-top:15px;">📜 HISTORIAL DE CAMBIOS</h4>
            <div id="lista-historial" class="sub-ventana-historial"></div>
        </div>

        <button class="secondary" onclick="logout()" style="margin-top: 40px;">Cerrar Sesión</button>
    </div>

    <div id="section-alumno" class="card hidden">
        <h2>Mi Entrenamiento</h2>
        <p style="text-align: center;">Atleta: <span id="display-alumno-name" style="color:var(--primary); font-weight:bold;"></span></p>
        <div id="lista-rutina"></div>
        <button id="btn-save-rutina" class="btn-save" onclick="guardarRutinaAlumno()">✅ GUARDAR MI PROGRESO</button>
        <button class="secondary" onclick="logout()" style="margin-top:20px">Cerrar Sesión</button>
    </div>
</div>

<script>
    function init() {
        let users = JSON.parse(localStorage.getItem('gym_users')) || {};
        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas')) || {};
        let historial = JSON.parse(localStorage.getItem('gym_historial')) || {};

        if (!users["juan"]) {
            users["juan"] = {pass: "123", role: "alumno"};
            rutinas["juan"] = [{nombre: "Press Banca", series: "4x10", peso: "60"}];
            localStorage.setItem('gym_users', JSON.stringify(users));
            localStorage.setItem('gym_rutinas', JSON.stringify(rutinas));
        }
        // Asegurar que el historial exista para evitar errores
        if (!historial["juan"]) {
            historial["juan"] = [];
            localStorage.setItem('gym_historial', JSON.stringify(historial));
        }
    }
    init();

    function login() {
        const u = document.getElementById('auth-user').value.toLowerCase().trim();
        const p = document.getElementById('auth-pass').value;
        let users = JSON.parse(localStorage.getItem('gym_users')) || {};
        if (users[u] && users[u].pass === p) {
            sessionStorage.setItem('active_user', u);
            showPanel(users[u].role, u);
        } else { alert("Datos incorrectos"); }
    }

    function register() {
        const u = document.getElementById('auth-user').value.toLowerCase().trim();
        const p = document.getElementById('auth-pass').value;
        const r = document.getElementById('auth-role').value;
        let users = JSON.parse(localStorage.getItem('gym_users')) || {};
        users[u] = { pass: p, role: r };
        localStorage.setItem('gym_users', JSON.stringify(users));
        
        let historial = JSON.parse(localStorage.getItem('gym_historial')) || {};
        if(!historial[u]) historial[u] = [];
        localStorage.setItem('gym_historial', JSON.stringify(historial));
        
        alert("Usuario registrado.");
    }

    function showPanel(role, username) {
        document.getElementById('section-auth').classList.add('hidden');
        if (role === 'profe') {
            document.getElementById('section-profe').classList.remove('hidden');
        } else {
            document.getElementById('section-alumno').classList.remove('hidden');
            document.getElementById('display-alumno-name').innerText = username.toUpperCase();
            cargarRutinaAlumno(username);
        }
    }

    function asignarRutina() {
        const al = document.getElementById('p-nombre-alumno').value.toLowerCase().trim();
        const ej = document.getElementById('p-ejercicio').value;
        const se = document.getElementById('p-series').value;
        if (!al || !ej) return alert("Faltan datos");
        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas')) || {};
        if (!rutinas[al]) rutinas[al] = [];
        rutinas[al].push({ nombre: ej, series: se, peso: "" });
        localStorage.setItem('gym_rutinas', JSON.stringify(rutinas));
        alert("Ejercicio agregado");
        verProgreso(); 
    }

    function verProgreso() {
        const al = document.getElementById('p-nombre-alumno').value.toLowerCase().trim();
        const visor = document.getElementById('visor-progreso');
        const subVentana = document.getElementById('sub-ventana-historial');
        const listaH = document.getElementById('lista-historial');
        
        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas')) || {};
        let historial = JSON.parse(localStorage.getItem('gym_historial')) || {};

        if (!rutinas[al]) return alert("Alumno sin datos.");

        visor.classList.remove('hidden');
        visor.innerHTML = `<h4>RUTINA ACTUAL: ${al.toUpperCase()}</h4>`;
        rutinas[al].forEach((item, index) => {
            visor.innerHTML += `
                <div class="item-progreso">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span>${item.nombre}: <b>${item.peso || 'S/D'}</b></span>
                        <button class="btn-danger" onclick="eliminarEjercicio('${al}', ${index})">ELIMINAR</button>
                    </div>
                </div>`;
        });

        subVentana.classList.remove('hidden');
        const misRegistros = historial[al] || [];
        listaH.innerHTML = misRegistros.length ? "" : "<p style='font-size:0.75rem; text-align:center;'>No hay registros en la bitácora todavía.</p>";
        
        [...misRegistros].reverse().forEach(reg => {
            listaH.innerHTML += `
                <div class="registro-historial">
                    <span class="txt-fecha-h">${reg.fecha}</span>
                    <span>${reg.ejercicio}</span>
                    <span class="txt-peso-h">${reg.peso}</span>
                </div>`;
        });
    }

    function eliminarEjercicio(alumno, index) {
        if(!confirm("¿Borrar este ejercicio de la rutina?")) return;
        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas'));
        rutinas[alumno].splice(index, 1);
        localStorage.setItem('gym_rutinas', JSON.stringify(rutinas));
        verProgreso();
    }

    function cargarRutinaAlumno(u) {
        const container = document.getElementById('lista-rutina');
        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas')) || {};
        const miRutina = rutinas[u.toLowerCase()] || [];
        container.innerHTML = miRutina.length ? "" : "<p>No tienes rutina hoy.</p>";
        miRutina.forEach((item, index) => {
            container.innerHTML += `
                <div class="rutina-item">
                    <strong>${item.nombre}</strong> <span class="badge">${item.series}</span>
                    <input type="text" class="input-peso" data-ej="${item.nombre}" placeholder="Peso levantado" value="${item.peso || ''}">
                </div>`;
        });
    }

    function guardarRutinaAlumno() {
        const user = sessionStorage.getItem('active_user');
        const inputs = document.querySelectorAll('.input-peso');
        let rutinas = JSON.parse(localStorage.getItem('gym_rutinas'));
        let historial = JSON.parse(localStorage.getItem('gym_historial')) || {};
        
        if (!historial[user]) historial[user] = [];
        const ahora = new Date().toLocaleString('es-ES', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });

        inputs.forEach((input, index) => {
            const nuevoPeso = input.value;
            const nombreEj = input.getAttribute('data-ej');

            if (rutinas[user][index].peso !== nuevoPeso && nuevoPeso !== "") {
                historial[user].push({ fecha: ahora, ejercicio: nombreEj, peso: nuevoPeso });
                rutinas[user][index].peso = nuevoPeso;
            }
        });

        localStorage.setItem('gym_rutinas', JSON.stringify(rutinas));
        localStorage.setItem('gym_historial', JSON.stringify(historial));
        alert("✅ Rutina y Bitácora guardadas.");
    }

    function logout() { sessionStorage.clear(); location.reload(); }
</script>
</body>
</html>
