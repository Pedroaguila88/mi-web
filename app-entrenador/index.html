<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pedro Alfonso - Coach System v5.5 CLOUD</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #d4ff00; --bg: #111; --card: #222; --text: #eee; --accent: #00d4ff; --danger: #ff4444; --success: #28a745; --dev: #ff00ff; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; }
        .container { max-width: 600px; margin: auto; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; border-top: 4px solid var(--primary); margin-bottom: 15px; }
        .dev-card { border-top-color: var(--dev); }
        .status-cloud { font-size: 0.7rem; text-align: right; color: var(--accent); font-weight: bold; margin-bottom: 10px; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; box-sizing: border-box; font-size: 1rem; }
        input, select { background: #333; color: white; border: 1px solid #444; }
        button { background: var(--primary); color: black; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        button.secondary { background: #444; color: white; margin-top: 10px; font-size: 0.8rem; }
        button.btn-day { background: #333; color: white; width: auto; padding: 8px 12px; font-size: 0.7rem; margin-right: 5px; border: 1px solid #444; margin-bottom: 5px; }
        button.active-day { background: var(--primary); color: black; border-color: var(--primary); }
        .hidden { display: none; }
        .rutina-item { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-top: 10px; border-left: 4px solid var(--primary); }
        .badge { background: var(--primary); color: black; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        .visor-box { background: #000; padding: 15px; border-radius: 10px; margin-top: 15px; border: 1px solid #333; }
        .ejercicio-visor-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding: 8px 0; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="container">
    <div id="cloud-status" class="status-cloud">☁️ ESTADO: DESCONECTADO</div>
    
    <div id="section-auth" class="card">
        <h1>🏋️‍♂️ COACH SYSTEM v5.5</h1>
        <input type="text" id="auth-user" placeholder="Usuario">
        <input type="password" id="auth-pass" placeholder="Contraseña">
        <button onclick="login()">ENTRAR Y SINCRONIZAR</button>
    </div>

    <div id="section-dev" class="card dev-card hidden">
        <h2 style="color:var(--dev);">PANEL MASTER PEDRO</h2>
        <input type="text" id="reg-user" placeholder="Nuevo Usuario">
        <input type="password" id="reg-pass" placeholder="Contraseña">
        <select id="reg-role" onchange="toggleProfeSelector()">
            <option value="profe">Entrenador</option>
            <option value="alumno">Alumno</option>
        </select>
        <div id="vinculo-profe-container" class="hidden">
            <select id="reg-profe-asignado"></select>
        </div>
        <button onclick="masterRegister()">CREAR EN LA NUBE</button>
        <div id="lista-usuarios-master" style="margin-top:20px;"></div>
        <button class="secondary" onclick="logout()">Cerrar Sesión</button>
    </div>

    <div id="section-profe" class="card hidden">
        <h2 id="welcome-profe">Panel Profe</h2>
        <label>Alumno:</label>
        <select id="p-nombre-alumno"></select>
        <select id="p-dia-semana">
            <option value="lunes">Lunes</option><option value="martes">Martes</option><option value="miercoles">Miércoles</option><option value="jueves">Jueves</option><option value="viernes">Viernes</option>
        </select>
        <input type="text" id="p-ejercicio-nombre" placeholder="Nombre Ejercicio">
        <input type="text" id="p-series" placeholder="Series (4x12)">
        <button onclick="asignarRutina()">ASIGNAR EJERCICIO</button>
        <button class="secondary" style="background:var(--accent); color:black;" onclick="verProgreso()">GESTIONAR PLAN ACTUAL</button>
        <div id="visor-progreso" class="hidden">
            <div id="dias-selector-profe" style="display:flex; overflow-x:auto; padding:10px 0;">
                <button class="btn-day" onclick="cambiarDiaVisor('lunes', this)">LUN</button>
                <button class="btn-day" onclick="cambiarDiaVisor('martes', this)">MAR</button>
                <button class="btn-day" onclick="cambiarDiaVisor('miercoles', this)">MIE</button>
                <button class="btn-day" onclick="cambiarDiaVisor('jueves', this)">JUE</button>
                <button class="btn-day" onclick="cambiarDiaVisor('viernes', this)">VIE</button>
            </div>
            <div id="lista-ejercicios-visor" class="visor-box"></div>
        </div>
        <button class="secondary" onclick="logout()">Cerrar Sesión</button>
    </div>

    <div id="section-alumno" class="card hidden">
        <h2 id="welcome-alumno">Mi Plan</h2>
        <div id="dias-selector-alumno" style="display:flex; overflow-x:auto; padding-bottom:10px;">
            <button class="btn-day active-day" onclick="cargarDiaAlumno('lunes', this)">LUN</button>
            <button class="btn-day" onclick="cargarDiaAlumno('martes', this)">MAR</button>
            <button class="btn-day" onclick="cargarDiaAlumno('miercoles', this)">MIE</button>
            <button class="btn-day" onclick="cargarDiaAlumno('jueves', this)">JUE</button>
            <button class="btn-day" onclick="cargarDiaAlumno('viernes', this)">VIE</button>
        </div>
        <div id="lista-rutina"></div>
        <button style="background:var(--success); color:white; margin-top:15px;" onclick="guardarPesoAlumno()">✅ GUARDAR PESO EN RED</button>
        <button class="secondary" onclick="logout()">Cerrar Sesión</button>
    </div>
</div>

<script>
    const API_KEY = '$2a$10$zfsAHWU1giWch9ex7eYH2.G7XiEs2zV9/qjA1Cwj2hlV5EXTTVuI2'; 
    const BIN_ID = '69b6487cc3097a1dd527b005';
    let DATOS_GLOBALES = { users: {}, rutinas: {} };
    let diaSeleccionadoAlumno = 'lunes';

    async function descargarDeLaRed() {
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': API_KEY } });
            const data = await res.json();
            DATOS_GLOBALES = data.record;
            document.getElementById('cloud-status').innerText = "✅ SINCRONIZADO";
        } catch (e) { document.getElementById('cloud-status').innerText = "❌ ERROR RED"; }
    }

    async function subirALaRed() {
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify(DATOS_GLOBALES)
            });
            document.getElementById('cloud-status').innerText = "✅ RED ACTUALIZADA";
        } catch (e) { alert("Error al subir cambios"); }
    }

    async function login() {
        await descargarDeLaRed();
        const u = document.getElementById('auth-user').value.toLowerCase().trim();
        const p = document.getElementById('auth-pass').value;
        if (u === "pedro alfonso" && p === "0994rocio") renderDashboard('dev', u);
        else if (DATOS_GLOBALES.users[u] && DATOS_GLOBALES.users[u].pass === p) renderDashboard(DATOS_GLOBALES.users[u].role, u);
        else alert("Credenciales incorrectas");
    }

    function renderDashboard(role, username) {
        document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
        sessionStorage.setItem('active_user', username);
        if (role === 'dev') {
            document.getElementById('section-dev').classList.remove('hidden');
            actualizarSelectProfes(); renderMasterUsers();
        } else if (role === 'profe') {
            document.getElementById('section-profe').classList.remove('hidden');
            document.getElementById('welcome-profe').innerText = `PROFE: ${username.toUpperCase()}`;
            actualizarSelectAlumnosProfe(username);
        } else {
            document.getElementById('section-alumno').classList.remove('hidden');
            document.getElementById('welcome-alumno').innerText = `ATLETA: ${username.toUpperCase()}`;
            cargarDiaAlumno('lunes');
        }
    }

    // --- LOGICA ALUMNO ---
    function cargarDiaAlumno(dia, btn) {
        diaSeleccionadoAlumno = dia;
        const u = sessionStorage.getItem('active_user');
        const cont = document.getElementById('lista-rutina');
        const r = (DATOS_GLOBALES.rutinas[u] && DATOS_GLOBALES.rutinas[u][dia]) ? DATOS_GLOBALES.rutinas[u][dia] : [];
        
        document.querySelectorAll('#dias-selector-alumno .btn-day').forEach(b => b.classList.remove('active-day'));
        if(btn) btn.classList.add('active-day');

        cont.innerHTML = r.length ? "" : "<p style='text-align:center;'>Descanso</p>";
        r.forEach((item, idx) => {
            cont.innerHTML += `<div class="rutina-item">
                <strong>${item.nombre}</strong> <span class="badge">${item.series}</span>
                <input type="number" class="peso-input" data-idx="${idx}" placeholder="Peso Kg" value="${item.peso || ''}">
            </div>`;
        });
    }

    async function guardarPesoAlumno() {
        const u = sessionStorage.getItem('active_user');
        const inputs = document.querySelectorAll('.peso-input');
        inputs.forEach(input => {
            const idx = input.getAttribute('data-idx');
            DATOS_GLOBALES.rutinas[u][diaSeleccionadoAlumno][idx].peso = input.value;
        });
        await subirALaRed();
        alert("✅ Pesos guardados en la red");
    }

    // --- LOGICA PROFE ---
    function actualizarSelectAlumnosProfe(profe) {
        const sel = document.getElementById('p-nombre-alumno');
        sel.innerHTML = "";
        for (let u in DATOS_GLOBALES.users) {
            if (DATOS_GLOBALES.users[u].profe_asignado === profe) {
                sel.innerHTML += `<option value="${u}">${u.toUpperCase()}</option>`;
            }
        }
    }

    function verProgreso() { document.getElementById('visor-progreso').classList.toggle('hidden'); cambiarDiaVisor('lunes'); }

    function cambiarDiaVisor(dia, btn) {
        const al = document.getElementById('p-nombre-alumno').value;
        const lista = document.getElementById('lista-ejercicios-visor');
        const r = (DATOS_GLOBALES.rutinas[al] && DATOS_GLOBALES.rutinas[al][dia]) ? DATOS_GLOBALES.rutinas[al][dia] : [];
        document.querySelectorAll('#dias-selector-profe .btn-day').forEach(b => b.classList.remove('active-day'));
        if(btn) btn.classList.add('active-day');
        lista.innerHTML = r.length ? "" : "Vacío";
        r.forEach((item, idx) => {
            lista.innerHTML += `<div class="ejercicio-visor-item"><span>${item.nombre}</span> <b>${item.peso || '0'}kg</b></div>`;
        });
    }

    async function asignarRutina() {
        const al = document.getElementById('p-nombre-alumno').value;
        const dia = document.getElementById('p-dia-semana').value;
        const ej = document.getElementById('p-ejercicio-nombre').value;
        const se = document.getElementById('p-series').value;
        if (!DATOS_GLOBALES.rutinas[al]) DATOS_GLOBALES.rutinas[al] = { lunes:[], martes:[], miercoles:[], jueves:[], viernes:[] };
        DATOS_GLOBALES.rutinas[al][dia].push({ nombre: ej, series: se, peso: "" });
        await subirALaRed();
        alert("Enviado!");
    }

    // --- MASTER ---
    function toggleProfeSelector() { document.getElementById('vinculo-profe-container').className = (document.getElementById('reg-role').value === 'alumno') ? "" : "hidden"; }
    function actualizarSelectProfes() {
        const sel = document.getElementById('reg-profe-asignado'); sel.innerHTML = "";
        for (let u in DATOS_GLOBALES.users) if (DATOS_GLOBALES.users[u].role === 'profe') sel.innerHTML += `<option value="${u}">${u}</option>`;
    }
    async function masterRegister() {
        const u = document.getElementById('reg-user').value.toLowerCase().trim();
        const p = document.getElementById('reg-pass').value;
        const r = document.getElementById('reg-role').value;
        const pr = document.getElementById('reg-profe-asignado').value;
        DATOS_GLOBALES.users[u] = { pass: p, role: r, profe_asignado: r === 'alumno' ? pr : null };
        await subirALaRed(); renderMasterUsers();
    }
    function renderMasterUsers() {
        const cont = document.getElementById('lista-usuarios-master'); cont.innerHTML = "";
        for (let u in DATOS_GLOBALES.users) cont.innerHTML += `<div>${u} (${DATOS_GLOBALES.users[u].role}) <button onclick="borrarMaster('${u}')">X</button></div>`;
    }
    async function borrarMaster(u) { delete DATOS_GLOBALES.users[u]; await subirALaRed(); renderMasterUsers(); }
    function logout() { location.reload(); }
    window.onload = descargarDeLaRed;
</script>
</body>
</html>
